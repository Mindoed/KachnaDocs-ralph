services:
  db:
    image: pgvector/pgvector:pg17
    container_name: kachnadocs-db
    environment:
      POSTGRES_USER: kachna
      POSTGRES_PASSWORD: kachna
      POSTGRES_DB: kachnadocs
    ports:
      - "5432:5432"
    volumes:
      - .pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kachna -d kachnadocs"]
      interval: 3s
      timeout: 3s
      retries: 20
